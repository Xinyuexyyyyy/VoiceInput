[package]
name = "voiceinput"
version = "0.1.0"
description = "Windows voice input protocol spike"
authors = ["VoiceInput contributors"]
edition = "2021"
rust-version = "1.88"
default-run = "voiceinput"

[lib]
name = "voiceinput_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3.6", default-features = false }
cpal = "0.15"
dotenvy = "0.15"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2.3"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
